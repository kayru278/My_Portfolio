<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Projects</title>
</head>
<body>
    <h1>Projects</h1>
    <ul>
        {% for project in projects %}
            <li>
                <a href="{% url 'project_detail' pk=project.pk %}">
                    {{ project.project_name }}
                </a>
            </li>
        {% empty %}
            <li>No projects found.</li>
        {% endfor %}
    </ul>
</body>
</html>
