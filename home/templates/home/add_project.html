<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h2 class="mb-3 text-primary fw-bold">Add New Project</h2>
            <p class="text-muted mb-4">Fill out the details below to add a project to your portfolio.</p>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 fw-bold mt-3">Save Project</button>
            </form>
            <a href="{% url 'project_list' %}" class="btn btn-link text-decoration-none text-center mt-2">Back to Projects</a>
        </div>
    </div>
</body>
</html>
